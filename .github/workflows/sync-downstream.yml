name: Sync Downstream Repositories

on:
  push:
    branches:
      - main
    paths:
      - '.agents/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'LICENSE'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream (Single Source of Truth)
        uses: actions/checkout@v4
        with:
          path: upstream

      - name: Checkout Downstream Antigravity Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/secure-tdd-antigravity
          token: ${{ secrets.SYNC_PAT || github.token }}
          path: secure-tdd-antigravity
        continue-on-error: true

      - name: Checkout Downstream Claude Code Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/secure-tdd-claude-code
          token: ${{ secrets.SYNC_PAT || github.token }}
          path: secure-tdd-claude-code
        continue-on-error: true

      - name: Run Downstream Sync Engine
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 upstream/scripts/sync_downstream.py \
            --antigravity-dir ./secure-tdd-antigravity \
            --claude-dir ./secure-tdd-claude-code \
            --commit \
            --push
